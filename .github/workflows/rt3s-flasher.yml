name: rt3s-flasher (Linux)

on:
  push:
    branches: [main]
    paths:
      - 'tools/rt3s-flasher/**'
      - 'MDUV380_firmware/tools/opengd77_stm32_firmware_loader.py'
      - 'MDUV380_firmware/STM32F405VGTX_FLASH.ld'
      - '.github/workflows/rt3s-flasher.yml'
  pull_request:
    paths:
      - 'tools/rt3s-flasher/**'
      - 'MDUV380_firmware/tools/opengd77_stm32_firmware_loader.py'
      - 'MDUV380_firmware/STM32F405VGTX_FLASH.ld'
      - '.github/workflows/rt3s-flasher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testy (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: tools/rt3s-flasher
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Zależności systemowe (libusb, Xvfb)
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q libusb-1.0-0 xvfb

      - name: Instalacja pakietu
        run: python -m pip install .

      - name: Szyfry zgodne z loaderem OpenGD77
        run: python scripts/gen_ciphers.py | diff -u rt3s_flasher/ciphers.py -

      - name: Testy jednostkowe (bez radia)
        run: python -m unittest discover -s tests -t . -v

      - name: Polecenie rt3s-flasher
        run: |
          rt3s-flasher --version
          rt3s-flasher --help
          rt3s-flasher list || test $? -eq 1   # brak radia w CI = kod 1

      - name: Okno (Xvfb)
        run: xvfb-run -a python -c "from rt3s_flasher import gui; raise SystemExit(gui.main(smoke_test=True))"

      - name: Skrypty powłoki
        run: bash -n install.sh
